<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Recuperar contraseña · ANLUV</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
  <header class="admin-head"><div><h1>ANLUV · Administración</h1><p>Recupera el acceso a tu cuenta.</p></div><a class="button secondary" href="admin.html">Volver a ingresar</a></header>
  <main class="admin-main">
    <section class="card login">
      <h2>Restablecer contraseña</h2>
      <p class="muted">Escribe el correo de tu cuenta de administrador. Te enviaremos un enlace seguro para crear una contraseña nueva.</p>
      <form id="recovery-form" class="grid">
        <label class="full">Correo electrónico<input id="email" type="email" autocomplete="email" required></label>
        <button class="full" type="submit">Enviar enlace de recuperación</button>
      </form>
      <p id="recovery-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    (function () {
      const config = window.ANLUV_SUPABASE || {};
      const form = document.querySelector('#recovery-form');
      const status = document.querySelector('#recovery-status');
      const setStatus = (message, error) => { status.textContent = message; status.className = 'status ' + (error ? 'error' : 'ok'); };
      if (!config.url || !config.anonKey || !window.supabase) {
        form.innerHTML = '<p class="status error">No se pudo conectar con el servicio de acceso.</p>';
        return;
      }
      const db = window.supabase.createClient(config.url, config.anonKey);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        setStatus('Enviando enlace…');
        const redirectTo = new URL('admin.html', window.location.href).href;
        const { error } = await db.auth.resetPasswordForEmail(document.querySelector('#email').value.trim(), { redirectTo });
        button.disabled = false;
        if (error) return setStatus(error.message || 'No se pudo enviar el enlace.', true);
        setStatus('Si existe una cuenta con este correo, recibirás un enlace de recuperación. Revisa también spam o promociones.');
      });
    })();
  </script>
</body>
</html>
