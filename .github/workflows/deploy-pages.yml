name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate public SEO pages from catalog
        env:
          SITE_URL: https://19rsroger-ctrl.github.io/anluv-design-system
          SUPABASE_URL: https://dyjbzcvoueudyglcgrpx.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_d26CU_mC23U0Ry3jZdrA7A_tHT5YkI_
        run: node scripts/generate-seo-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
